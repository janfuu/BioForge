# Builds the SKSE plugin on a Windows runner and uploads the ready mod folder
# (build/BioForge: SKSE/Plugins/BioForge.dll + the SkyrimNet layer) as an artifact.
name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg at the manifest's builtin-baseline, with binary caching.
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ee12231b20c95013c6638d845d04c91559a1d1ff

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: BioForge-${{ github.sha }}
          path: build/BioForge
